syntax = "proto3";

package events;

option go_package = "promocao/internal/models/proto/events";

import "google/protobuf/timestamp.proto";


message EventEnvelope {
    google.protobuf.Timestamp timestamp = 1;
    string producer_id = 2; 
    bytes signature = 3;

    oneof payload {
        NewPromotionEvent new_promotion = 4;
        VoteEvent vote = 5;
        PromotionPublishedEvent promotion_published = 6;
    }
}

message NewPromotionEvent {
    string promotion_id = 1;
    string category = 2;
    string description = 3;
    string store_email = 4;
}

message VoteEvent {
    string promotion_id = 1;
    int32 vote_value = 2;
    string category = 3;
    string description = 4;
    string store_email = 5;
}

message PromotionPublishedEvent {
    string promotion_id = 1;
    string category = 2;
    string description = 3;
    string store_email = 4;
}
