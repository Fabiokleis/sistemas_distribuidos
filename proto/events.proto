syntax = "proto3";

package events;

option go_package = "promocao/internal/models/proto/events";

import "google/protobuf/timestamp.proto";


message EventEnvelope {
    string signature = 1;
    google.protobuf.Timestamp timestamp = 2;

    oneof payload {
        NewPromotionEvent new_promotion = 3;
        VoteEvent vote = 4;
        PromotionPublishedEvent promotion_published = 5;
    }
}

message NewPromotionEvent {
    string promotion_id = 1;
    string category = 2;
    string description = 3;  
}

message VoteEvent {
    string promotion_id = 1;
    int32 vote_value = 2;
    string category = 3;
    string description = 4;
}

message PromotionPublishedEvent {
    string promotion_id = 1;
    string category = 2;
    string description = 3;
}
