<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promocoes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <span class="site-title">Promocoes</span>
    <span id="sse-status" class="status disconnected">desconectado</span>
  </header>

  <main id="main-content" style="display: grid">
    <div class="left-panel">

      <div id="section-interesses" class="section">
        <div class="section-title">Interesses
          <span id="categories-hint" class="hint">(conecte ao SSE)</span>
        </div>
        <div id="categories-tags"></div>
      </div>

      <div id="section-notificacoes" class="section">
        <div class="section-title row-between">
          <span>Notificacoes</span>
          <button class="link-btn" onclick="clearNotifications()">limpar</button>
        </div>
        <div id="notif-log">
          <p class="empty" id="notif-empty">nenhuma notificacao recebida.</p>
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <div class="right-panel">
      <div class="section-title row-between">
        <span>Promocoes</span>
        <button class="link-btn" onclick="loadPromotions()">atualizar</button>
      </div>
      <div id="promotions-list">
        <p class="empty">nenhuma promocao.</p>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
